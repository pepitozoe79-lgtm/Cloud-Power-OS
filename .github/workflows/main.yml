name: ⚡ Cloud Power CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 ShellCheck Linter
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -e SC2034,SC1091 install.sh
          # Validar scripts en tools/ si existen
          if ls tools/*.sh 1>/dev/null 2>&1; then
            shellcheck -e SC2034,SC1091 tools/*.sh
          fi

      - name: 📦 Syntax Check
        run: |
          bash -n install.sh
          if ls tools/*.sh 1>/dev/null 2>&1; then
            for f in tools/*.sh; do bash -n "$f"; done
          fi

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            tools/*.sh
