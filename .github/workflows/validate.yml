name: Validate Cloud Power Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck install.sh
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-alpha
          name: "Cloud Power Installer v2.0 Alpha"
          files: install.sh
          prerelease: true
