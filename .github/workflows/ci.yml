name: ⚡ Validate Cloud Power Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 ShellCheck Linter
        run: |
          sudo apt-get install -y shellcheck
          # SC2034: variables aparentemente no usadas (colores), SC1091: source externo
          shellcheck -e SC2034,SC1091 install.sh

      - name: 📦 Syntax Check (bash -n)
        run: bash -n install.sh
